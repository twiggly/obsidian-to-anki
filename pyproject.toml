[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-to-anki"
version = "0.1.0"
description = "Convert Obsidian notes matching selected tags into Anki TSV cards."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["ruff>=0.16.8,<0.17"]

[project.scripts]
obsidian-to-anki = "obsidian_to_anki.cli:main"

[tool.setuptools.packages.find]
include = ["obsidian_to_anki*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
